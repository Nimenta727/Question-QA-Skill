name: Immutable verified release / 不可变正式发行
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - tests/**
      - references/**
      - examples/**
      - docs/**
      - README.md
      - README.zh-CN.md
      - SKILL.md
      - VERSION
      - CHANGELOG.md
      - LICENSE
permissions:
  contents: read
concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  platform-gate:
    name: Release gate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, audit and run complete tests
        run: |
          python scripts/qa.py validate examples/sample_bank.json
          python scripts/question_quality.py examples/sample_bank.json --output quality-audit-ci.json
          python -c "import json; d=json.load(open('quality-audit-ci.json')); assert d['counts']['error']==0, d"
          python -m unittest discover -s tests -v
      - name: Build and verify ZIP on target OS
        run: |
          python scripts/build_release.py --output dist
          python scripts/build_release.py --verify dist/question-qa-skill-0.6.0.zip
  package:
    needs: platform-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository/version consistency
        shell: bash
        run: |
          test "$(cat VERSION)" = "0.6.0"
          grep -q 'version: "0.6.0"' SKILL.md
      - name: Build and checksum deterministic distribution
        shell: bash
        run: |
          python scripts/build_release.py --output dist
          python scripts/build_release.py --verify dist/question-qa-skill-0.6.0.zip
          python scripts/dashboard.py examples/sample_bank.json --state examples/demo_state.json --output dist/demo-dashboard.html --lang zh
          (cd dist && sha256sum question-qa-skill-0.6.0.zip demo-dashboard.html > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Run smoke tests inside a freshly extracted ZIP
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile('dist/question-qa-skill-0.6.0.zip') as z:
                  z.extractall(tmp)
              root=pathlib.Path(tmp)/'question-qa-skill-0.6.0'
              def invoke(*args):
                  subprocess.run([sys.executable,*args],cwd=str(root),check=True)
              invoke('scripts/qa.py','validate','examples/sample_bank.json')
              invoke('scripts/question_quality.py','examples/sample_bank.json')
              invoke('-m','unittest','discover','-s','tests','-v')
              target=pathlib.Path(tmp)/'preview.html'
              invoke('scripts/dashboard.py','examples/sample_bank.json',
                     '--state','examples/demo_state.json','--output',str(target))
              assert 'Concept map' in target.read_text(encoding='utf-8')
              print('Fresh-extraction smoke test passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Question-QA-Skill-v0.6.0-${{ github.run_id }}
          path: |
            dist/question-qa-skill-0.6.0.zip
            dist/SHA256SUMS.txt
            dist/demo-dashboard.html
          retention-days: 30
  publish:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Question-QA-Skill-v0.6.0-${{ github.run_id }}
          path: dist
      - name: Publish exactly once for a matching immutable Git tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          if [[ "$tag" != "v0.6.0" ]]; then
            echo "::error::Incorrect release version"; exit 1
          fi
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Branch changed since verification: skip stale release"; exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable $tag release exists: no changes made"; exit 0
          fi
          # GitHub CLI may emit JSON "null" to stdout even for a 404;
          # use the HTTP exit status rather than parsed response content.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag exists without expected Release. Refusing overwrite"; exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "$tag" \
            dist/question-qa-skill-0.6.0.zip dist/SHA256SUMS.txt dist/demo-dashboard.html \
            --verify-tag --title "Question-QA-Skill v0.6.0" \
            --notes-file docs/RELEASE_NOTES_v0.6.0.md --latest
