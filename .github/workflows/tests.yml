name: Tests / 测试
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate demonstration bank
        run: python scripts/qa.py validate examples/sample_bank.json
      - name: Audit sample question quality (static checks only)
        run: |
          python scripts/question_quality.py examples/sample_bank.json --output quality-audit-ci.json
          python -c "import json; r=json.load(open('quality-audit-ci.json')); assert r['counts']['error']==0, r"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
