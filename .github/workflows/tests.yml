name: Tests / 跨平台测试
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Tests on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate example bank
        run: python scripts/qa.py validate examples/sample_bank.json
      - name: Check item-quality hard errors
        run: |
          python scripts/question_quality.py examples/sample_bank.json --output quality-audit-ci.json
          python -c "import json; d=json.load(open('quality-audit-ci.json')); assert d['counts']['error']==0, d"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build verified archive and preview
        run: |
          python scripts/build_release.py --output dist
          python scripts/build_release.py --verify dist/question-qa-skill-0.7.0.zip
          python scripts/dashboard.py examples/sample_bank.json --state examples/demo_state.json --output dist/preview.html --lang en
